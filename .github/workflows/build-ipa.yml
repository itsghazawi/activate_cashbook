name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Activate-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Activate-unsigned-ipa
          path: Activate-unsigned.ipa

      - name: Publish as release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Activate (build ${{ github.run_number }})
          files: Activate-unsigned.ipa

      - name: Push IPA to ipa-build branch
        run: |
          mkdir -p /tmp/out && cp Activate-unsigned.ipa /tmp/out/
          cd /tmp/out
          git init -q -b ipa-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Activate-unsigned.ipa
          git commit -qm "IPA build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ipa-build
